client_id = "8e1097c6e785d72374aeea2693aaaaf1"
application_url = "https://atlanta-bowl-funky-talks.trycloudflare.com"
embedded = true
name = "ReferMate"

[access_scopes]
scopes = "write_products,write_metaobjects,write_metaobject_definitions,write_app_proxy,write_discounts,read_customers,read_orders"

[webhooks]
api_version = "2027-01"

[[webhooks.subscriptions]]
uri = "/webhooks/app/uninstalled"
topics = ["app/uninstalled"]

[[webhooks.subscriptions]]
uri = "/webhooks/app/scopes_update"
topics = ["app/scopes_update"]

# Referral tracking: leads, conversions and commission (app/conversion.server.js)
[[webhooks.subscriptions]]
uri = "/webhooks/checkouts/create"
topics = ["checkouts/create"]

[[webhooks.subscriptions]]
uri = "/webhooks/orders/paid"
topics = ["orders/paid"]

[[webhooks.subscriptions]]
uri = "/webhooks/orders/cancelled"
topics = ["orders/cancelled"]

[app_proxy]
url = "/proxy"
subpath = "referral"
prefix = "apps"

[auth]
redirect_urls = [
  "https://atlanta-bowl-funky-talks.trycloudflare.com/api/auth"
]

[build]
automatically_update_urls_on_dev = true
